<!doctype html>
<html lang="es">

  <title>Grid Layout - Horario de vuelos</title>
  <link rel="stylesheet" href="09_grid_layout_mp.css">
</head>
<body>
  <div class="horario">
    <div class="col hora">Hora</div>
    <div class="col vuelo">Vuelo</div>
    <div class="col destino">Destino</div>

    <div class="cell">08:30</div><div class="cell">GH234</div><div class="cell">Lima</div>
    <div class="cell">09:15</div><div class="cell">IJ567</div><div class="cell">Bogotá</div>

  </div>
</body>
</html>
